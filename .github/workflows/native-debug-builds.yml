name: Native Debug Builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.6"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  build-android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve package version
        shell: bash
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          echo "BUILD_VERSION=v${version}" >> "$GITHUB_ENV"

      - name: Build universal APK
        run: flutter build apk --debug

      - name: Build split APKs
        run: flutter build apk --debug --split-per-abi

      - name: Package APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/neiroha-Android-Universal-${BUILD_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "dist/neiroha-Android-ARM64-${BUILD_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk "dist/neiroha-Android-ARMv7-${BUILD_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-debug.apk "dist/neiroha-Android-AMD64-${BUILD_VERSION}.apk"
          (cd dist && sha256sum neiroha-Android-*.apk > SHA256SUMS-Android-debug.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neiroha-Android-debug-apk
          path: dist/**
          if-no-files-found: error

  build-linux:
    name: Linux desktop debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ccache \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libmpv-dev \
            libepoxy-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Restore C/C++ cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-linux-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-ccache-

      - name: Enable C/C++ compiler cache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --zero-stats

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve package version
        shell: bash
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          echo "BUILD_VERSION=v${version}" >> "$GITHUB_ENV"

      - name: Build Linux
        run: flutter build linux --debug

      - name: Remove local state from bundle
        run: |
          rm -rf \
            build/linux/x64/debug/bundle/data/neiroha.db \
            build/linux/x64/debug/bundle/neiroha_data

      - name: Show C/C++ cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Package Linux bundle
        run: |
          mkdir -p dist
          tar -C build/linux/x64/debug/bundle -czf "dist/neiroha-Linux-AMD64-${BUILD_VERSION}.tar.gz" .
          (cd dist && sha256sum neiroha-Linux-AMD64-*.tar.gz > SHA256SUMS-Linux-debug.txt)

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: neiroha-Linux-AMD64-debug
          path: dist/**
          if-no-files-found: error

  build-windows:
    name: Windows desktop debug
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve package version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $versionLine.Matches[0].Groups[1].Value.Split('+')[0].Trim()
          "BUILD_VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows
        run: flutter build windows --debug

      - name: Remove local state from bundle
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            "build/windows/x64/runner/Debug/data/neiroha.db", `
            "build/windows/x64/runner/Debug/neiroha_data"

      - name: Package Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipName = "neiroha-Windows-AMD64-${env:BUILD_VERSION}.zip"
          $zip = "dist/$zipName"
          Compress-Archive -Path "build/windows/x64/runner/Debug/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -FilePath "dist/SHA256SUMS-Windows-debug.txt" -Encoding ascii

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: neiroha-Windows-AMD64-debug
          path: dist/**
          if-no-files-found: error
