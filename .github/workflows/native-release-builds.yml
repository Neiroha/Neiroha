name: Native Release Builds

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish assets to, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FLUTTER_VERSION: "3.41.6"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          fi
          echo "BUILD_NAME=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=v$version" >> "$GITHUB_ENV"

      - name: Build universal APK
        run: flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Package APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/neiroha-Android-Universal-${ASSET_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/neiroha-Android-ARM64-${ASSET_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/neiroha-Android-ARMv7-${ASSET_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/neiroha-Android-AMD64-${ASSET_VERSION}.apk"

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/neiroha-Android-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neiroha-Android-release-apk
          path: dist/**
          if-no-files-found: error

  build-linux:
    name: Linux desktop release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ccache \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libmpv-dev \
            libepoxy-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Restore C/C++ cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-linux-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-ccache-

      - name: Enable C/C++ compiler cache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --zero-stats

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          fi
          echo "BUILD_NAME=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=v$version" >> "$GITHUB_ENV"

      - name: Build Linux
        run: flutter build linux --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Remove local state from bundle
        run: |
          rm -rf \
            build/linux/x64/release/bundle/data/neiroha.db \
            build/linux/x64/release/bundle/neiroha_data

      - name: Show C/C++ cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Package Linux bundle
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/neiroha-Linux-AMD64-${ASSET_VERSION}.tar.gz" .

      - name: Attest Linux provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/neiroha-Linux-AMD64-*.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: neiroha-Linux-AMD64-release
          path: dist/**
          if-no-files-found: error

  build-windows:
    name: Windows desktop release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          if ($version -match '^\d+\.\d+$') {
            $version = "$version.0"
          }
          "BUILD_NAME=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_NUMBER=$env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET_VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows
        run: flutter build windows --release --build-name "$env:BUILD_NAME" --build-number "$env:BUILD_NUMBER"

      - name: Remove local state from bundle
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            "build/windows/x64/runner/Release/data/neiroha.db", `
            "build/windows/x64/runner/Release/neiroha_data"

      - name: Package Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipName = "neiroha-Windows-AMD64-${env:ASSET_VERSION}.zip"
          $zip = "dist/$zipName"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip -Force

      - name: Attest Windows provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/neiroha-Windows-AMD64-*.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: neiroha-Windows-AMD64-release
          path: dist/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-linux
      - build-windows
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum neiroha-* | sort -k2 > SHA256SUMS.txt
          cd ..

          release_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || git rev-parse HEAD)"
          previous_tag="$(git describe --tags --abbrev=0 "${release_sha}^" --match 'v*' 2>/dev/null || true)"

          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${release_sha}"
            compare_url="${SERVER_URL}/${REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
          else
            commit_range="$release_sha"
            compare_url="${SERVER_URL}/${REPOSITORY}/commits/${RELEASE_TAG}"
          fi

          if notes="$(gh api "repos/${REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            --jq '.body' 2>/dev/null)"; then
            printf "%s\n\n" "$notes" > RELEASE_NOTES.md
          else
            {
              echo "## What's Changed"
              echo
              echo "See the commit log below."
              echo
              echo "**Full Changelog**: ${compare_url}"
              echo
            } > RELEASE_NOTES.md
          fi

          commit_count="$(git rev-list --count "$commit_range" 2>/dev/null || echo 0)"
          {
            echo "## Commit Log"
            echo
            if [[ "$commit_count" == "0" ]]; then
              echo "- No commits found for this release range."
            else
              git log -n 50 --date=short --pretty=format:'- `%h` %s (%an, %ad)' "$commit_range"
              echo
              if (( commit_count > 50 )); then
                echo "- ...and $((commit_count - 50)) more commits."
              fi
            fi
            echo
          } >> RELEASE_NOTES.md

          current_authors="$(mktemp)"
          previous_authors="$(mktemp)"
          first_time_authors="$(mktemp)"
          git log --format='%ae%x09%an' "$commit_range" \
            | sort -u \
            | awk -F '\t' 'tolower($2) !~ /bot/ { print }' \
            > "$current_authors"
          if [[ -n "$previous_tag" ]]; then
            git log --format='%ae' "$previous_tag" | sort -u > "$previous_authors"
            awk -F '\t' 'NR == FNR { seen[$1] = 1; next } !seen[$1] { print "- " $2 }' \
              "$previous_authors" "$current_authors" \
              | sort -u > "$first_time_authors"
          else
            awk -F '\t' '{ print "- " $2 }' "$current_authors" | sort -u > "$first_time_authors"
          fi

          {
            echo "## First-Time Contributors"
            echo
            if [[ -s "$first_time_authors" ]]; then
              cat "$first_time_authors"
            else
              echo "- None"
            fi
            echo
            echo "## Checksums"
            echo
            echo "| Asset | SHA256 |"
            echo "|---|---|"
            while read -r hash file; do
              echo "| \`${file}\` | \`${hash}\` |"
            done < dist/SHA256SUMS.txt
          } >> RELEASE_NOTES.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Neiroha ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: dist/neiroha-*
