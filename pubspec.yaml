name: neiroha
description: "AI audio middleware and dubbing workstation"
publish_to: 'none'
version: 0.4.2+8

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.4.3

  # Local database (Drift = type-safe SQLite)
  drift: ^2.35.0

  # Local HTTP server
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # Networking (for upstream TTS provider calls)
  dio: ^5.7.0

  # Data classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Audio playback
  audioplayers: ^6.0.0

  # Windows microphone recording (MediaFoundation, without federated record pkg)
  record_platform_interface: ^2.1.0
  record_windows: ^2.3.0

  # Video playback (libmpv-based — desktop-capable across Win/macOS/Linux)
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5

  # File picker for ref audio upload
  file_picker: ^13.1.0

  # Utilities
  intl: any
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  window_manager: ^0.5.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.0
  drift_dev: ^2.35.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
